<body>
<div class="wrap">
  <h1>Sandbox de práctica</h1>
  <p class="sub">Escribís tu respuesta en la notación de la cátedra y la <b>valido de verdad</b>: la corro contra ejemplos que deben aceptarse y otros que deben rechazarse. Estilo parcial, no flex/bison. Todo local.</p>

  <div class="tabs">
    <button class="tab on" data-t="er">Expresiones regulares</button>
    <button class="tab" data-t="al">Acciones léxicas</button>
    <button class="tab" data-t="glc">Gramáticas (GLC)</button>
  </div>

  <div id="panel"></div>
</div>

<script>
/* ================= MOTOR: compilar ER de la cátedra a RegExp ================= */
function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\/]/g,'\\$&'); }
function parseConjuntos(text){
  const defs={};
  (text||'').split(/\n/).forEach(line=>{
    line=line.trim(); if(!line) return;
    const m=line.match(/^([A-Za-z_][A-Za-z0-9_]*)\s+(.+)$/);
    if(m) defs[m[1]]=m[2].trim();
  });
  return defs;
}
function erToRegex(expr, defs){
  let guard=0;
  function compile(s){
    let r='', j=0;
    while(j<s.length){
      const c=s[j];
      if(/\s/.test(c)){ j++; continue; }
      if(c==='{'){
        const k=s.indexOf('}', j); if(k<0) throw new Error('Falta cerrar "}"');
        const name=s.slice(j+1,k).trim();
        if(!(name in defs)) throw new Error('Conjunto no definido: {'+name+'}');
        if(++guard>2000) throw new Error('Referencia circular entre conjuntos');
        r+='(?:'+compile(defs[name])+')'; j=k+1;
      } else if(c==='"'||c==='“'||c==='”'){
        let k=j+1, lit='';
        while(k<s.length && !(s[k]==='"'||s[k]==='“'||s[k]==='”')){ lit+=s[k]; k++; }
        if(k>=s.length) throw new Error('Falta cerrar la comilla del literal');
        r+=escapeRe(lit); j=k+1;
      } else if(c==='['){
        const k=s.indexOf(']', j); if(k<0) throw new Error('Falta cerrar "]"');
        r+=s.slice(j,k+1); j=k+1;
      } else if('*+?|()'.indexOf(c)>=0){ r+=c; j++; }
      else { r+=escapeRe(c); j++; }
    }
    return r;
  }
  return compile(expr);
}
function buildRegex(expr, defs){
  const src=erToRegex(expr, defs);
  return new RegExp('^(?:'+src+')$');
}
function attrValue(atr, lexema){
  if(atr==='valor'){ const n=parseFloat(lexema); return isNaN(n)?null:n; }
  if(atr==='valor_abs'){ const n=parseFloat(lexema); return isNaN(n)?null:Math.abs(n); }
  if(atr==='longitud') return lexema.length;
  if(atr==='longitud_sin_comillas'){
    let s=lexema; if(s.length>=2 && /["“]/.test(s[0]) && /["”]/.test(s[s.length-1])) s=s.slice(1,-1);
    return s.length;
  }
  return null;
}
function cmp(a,op,b){ if(a===null) return false; switch(op){case '<=':return a<=b;case '<':return a<b;case '==':return a===b;case '>=':return a>=b;case '>':return a>b;} return false; }

/* ================= MOTOR: reconocedor Earley para GLC ================= */
function parseGrammar(text){
  const rules=[]; const nts=new Set(); let start=null;
  (text||'').split(/\n/).forEach(line=>{
    line=line.trim(); if(!line||line.startsWith('#')||line.startsWith('//')) return;
    const parts=line.split(/->|→|::=/);
    if(parts.length<2) return;
    const lhs=parts[0].trim(); if(!lhs) return;
    nts.add(lhs); if(start===null) start=lhs;
    parts.slice(1).join('->').split('|').forEach(alt=>{
      let syms=alt.trim().split(/\s+/).filter(x=>x.length);
      if(syms.length===1 && /^(ε|lambda|epsilon|λ|vacio|vacío|e)$/i.test(syms[0])) syms=[];
      rules.push({lhs, rhs:syms});
    });
  });
  return {rules, nts, start};
}
function earleyAccepts(g, input){
  if(!g.start) throw new Error('Gramática vacía');
  const n=input.length;
  const chart=[]; for(let i=0;i<=n;i++) chart.push([]);
  const key=it=>it.lhs+'|'+it.rhs.join(' ')+'|'+it.dot+'|'+it.start;
  const seen=[]; for(let i=0;i<=n;i++) seen.push(new Set());
  function add(i,it){ const k=key(it); if(seen[i].has(k)) return; seen[i].add(k); chart[i].push(it); }
  g.rules.filter(r=>r.lhs===g.start).forEach(r=>add(0,{lhs:r.lhs,rhs:r.rhs,dot:0,start:0}));
  for(let i=0;i<=n;i++){
    for(let x=0;x<chart[i].length;x++){
      const it=chart[i][x];
      if(it.dot<it.rhs.length){
        const sym=it.rhs[it.dot];
        if(g.nts.has(sym)){
          g.rules.filter(r=>r.lhs===sym).forEach(r=>add(i,{lhs:r.lhs,rhs:r.rhs,dot:0,start:i}));
          // completar nullable ya reconocido
          chart[i].forEach(jt=>{ if(jt.start===i && jt.lhs===sym && jt.dot===jt.rhs.length) add(i,{lhs:it.lhs,rhs:it.rhs,dot:it.dot+1,start:it.start}); });
        } else if(i<n && input[i]===sym){
          add(i+1,{lhs:it.lhs,rhs:it.rhs,dot:it.dot+1,start:it.start});
        }
      } else {
        chart[it.start].forEach(jt=>{ if(jt.dot<jt.rhs.length && jt.rhs[jt.dot]===it.lhs) add(i,{lhs:jt.lhs,rhs:jt.rhs,dot:jt.dot+1,start:jt.start}); });
      }
    }
  }
  return chart[n].some(it=>it.lhs===g.start && it.dot===it.rhs.length && it.start===0);
}
function tokenize(s){ return (s||'').trim().split(/\s+/).filter(x=>x.length); }

/* ================= BANCO DE EJERCICIOS ================= */

  cj:'DIGITO  [0-9]\nLETRA   [a-zA-Z]', m:'{LETRA}("-"?({LETRA}|{DIGITO}))*',

  ac:['lyc@hotmail.com','lyc+comision-2024@unlam.edu.ar','lyc+comision-2024@gmail.com'], rc:['Lyc@gmail.com','lyc@otro.com','@gmail.com','lyc+@gmail.com']},
];

const AL_EJ=[
 {id:'int',t:'Constante entera con cota (Int de L1_aho)',c:'Constante entera sin signo. El valor máximo es 32767. La cota va en la ACCIÓN LÉXICA, no en la expresión regular.',

const GLC_EJ=[
 {id:'par',t:'Paréntesis balanceados',c:'Gramática que genere secuencias de paréntesis balanceados, incluida la cadena vacía.',
  m:'S -> ( S ) S | ε', ac:['','( )','( ( ) )','( ) ( )'], rc:['(','( (','( ) )',') (']},

/* ================= UI ================= */
var panel=document.getElementById('panel');
var TAB='er';
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  TAB=b.dataset.t; document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b)); render();
});
function esc(s){return (s+'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function showStr(s){ return s==='' ? '⟨vacío⟩' : esc(s); }

var symKeys=['{','}','(',')','|','*','+','?','[',']','"','-','.','ε'];

function render(){
  if(TAB==='er') renderER();
  else if(TAB==='al') renderAL();
  else renderGLC();
}

/* ---- ER ---- */
function renderER(){
  let opts=ER_EJ.map((e,i)=>`<option value="${i}">${esc(e.t)}</option>`).join('');
  panel.innerHTML=`<div class="card">
    <label class="fld">Ejercicio</label>
    <select id="ex">${opts}</select>
    <div class="consigna" id="cons"></div>
    <label class="fld">Conjuntos (uno por línea: NOMBRE  definición)</label>
    <textarea id="cj" rows="3"></textarea>
    <label class="fld">Expresión regular del token</label>
    <input type="text" id="er" placeholder="Ej: {DIGITO1}{DIGITO}{DIGITO}{DIGITO}">
    <div class="keys" id="keys"></div>
    <div class="row" style="margin-top:12px"><div style="flex:0"><button class="pri" id="val">Validar</button></div>
      <div style="flex:1"><input type="text" id="own" placeholder="probar una cadena propia (opcional)"></div>
      <div style="flex:0"><button id="valown">probar</button></div></div>
    <div class="res" id="res"></div>
    <details><summary>Ver respuesta modelo</summary><div class="modelo" id="mod"></div></details>
    <p class="hint">Notación: <code>{NOMBRE}</code> referencia un conjunto · <code>[0-9]</code> clase · <code>"texto"</code> literal exacto · operadores <code>* + ? | ( )</code> · la concatenación es escribir seguido. Los espacios se ignoran.</p>
  </div>`;
  const sel=document.getElementById('ex');
  function load(){ const e=ER_EJ[+sel.value];
    document.getElementById('cons').innerHTML=esc(e.c);
    document.getElementById('cj').value=e.cj;
    document.getElementById('er').value='';
    document.getElementById('res').innerHTML='';
    document.getElementById('own').value='';
    document.getElementById('mod').innerHTML=`<p>Una solución válida:</p><pre>CONJUNTO\n${esc(e.cj)}\n\nTOKEN     EXP. REG.\n${esc(e.t.split(' ')[0].toUpperCase())}      ${esc(e.m)}</pre>
      <p class="hint">Puede haber varias ER equivalentes correctas — lo que importa es que acepte y rechace lo que corresponde.</p>`;
  }
  sel.onchange=load; load();
  document.getElementById('keys').innerHTML=symKeys.map(k=>`<button data-k="${esc(k)}">${esc(k)}</button>`).join('');
  document.querySelectorAll('#keys button').forEach(b=>b.onclick=()=>insertAt(document.getElementById('er'),b.dataset.k));
  document.getElementById('val').onclick=()=>validateER(false);
  document.getElementById('valown').onclick=()=>validateER(true);
}
function validateER(withOwn){
  const e=ER_EJ[+document.getElementById('ex').value];
  const defs=parseConjuntos(document.getElementById('cj').value);
  const expr=document.getElementById('er').value.trim();
  const res=document.getElementById('res');
  if(!expr){ res.innerHTML=`<div class="err">Escribí una expresión regular.</div>`; return; }
  let rx;
  try{ rx=buildRegex(expr, defs); }
  catch(err){ res.innerHTML=`<div class="err">Error al compilar: ${esc(err.message)}</div>`; return; }
  let html='', allOk=true;
  e.ac.forEach(s=>{ const m=rx.test(s); if(!m)allOk=false; html+=caseRow(s,m,true); });
  e.rc.forEach(s=>{ const m=rx.test(s); if(m)allOk=false; html+=caseRow(s,m,false); });
  if(withOwn){ const o=document.getElementById('own').value; if(o!==''){ const m=rx.test(o); html+=`<div class="case ${m?'pass':'fail'}"><span class="ico">${m?'✓':'✗'}</span><span>${showStr(o)}</span><span class="exp">${m?'la acepta':'la rechaza'}</span></div>`; } }
  res.innerHTML=`<div class="verdict ${allOk?'ok':'bad'}">${allOk?'✓ ¡Correcta! Acepta y rechaza todo lo esperado.':'✗ Todavía no: revisá los casos marcados en rojo.'}</div>`+html;
}
function caseRow(s,matched,shouldMatch){
  const pass = matched===shouldMatch;
  return `<div class="case ${pass?'pass':'fail'}"><span class="ico">${pass?'✓':'✗'}</span><span>${showStr(s)}</span><span class="exp">${shouldMatch?'debe aceptar':'debe rechazar'}${pass?'':(matched?' — la acepta':' — la rechaza')}</span></div>`;
}

/* ---- Acciones léxicas ---- */
function renderAL(){
  let opts=AL_EJ.map((e,i)=>`<option value="${i}">${esc(e.t)}</option>`).join('');
  panel.innerHTML=`<div class="card">
    <label class="fld">Ejercicio</label>
    <select id="ex">${opts}</select>
    <div class="consigna" id="cons"></div>
    <label class="fld">Conjuntos</label>
    <textarea id="cj" rows="3"></textarea>
    <label class="fld">Expresión regular del token</label>
    <input type="text" id="er">
    <label class="fld">Acción léxica — condición que debe cumplir el lexema</label>
    <div class="row">
      <div><select id="atr">
        <option value="valor">valor (numérico)</option>
        <option value="valor_abs">valor absoluto</option>
        <option value="longitud">longitud (caracteres)</option>
        <option value="longitud_sin_comillas">longitud sin las comillas</option>
      </select></div>
      <div style="flex:0"><select id="op"><option>&lt;=</option><option>&lt;</option><option>==</option><option>&gt;=</option><option>&gt;</option></select></div>
      <div><input type="number" id="cota" placeholder="cota"></div>
    </div>
    <div class="row" style="margin-top:12px"><div style="flex:0"><button class="pri" id="val">Validar</button></div></div>
    <div class="res" id="res"></div>
    <details><summary>Ver respuesta modelo</summary><div class="modelo" id="mod"></div></details>
    <p class="hint">La idea del ejercicio: la <b>expresión regular</b> reconoce la forma; la <b>acción léxica</b> chequea la cota (rango o longitud). Un valor con forma válida pero fuera de cota se rechaza <b>en la acción</b>, en tiempo de compilación.</p>
  </div>`;
  const sel=document.getElementById('ex');
  function load(){ const e=AL_EJ[+sel.value];
    document.getElementById('cons').innerHTML=esc(e.c);
    document.getElementById('cj').value=e.cj;
    document.getElementById('er').value='';
    document.getElementById('atr').value='valor';
    document.getElementById('op').value='<=';
    document.getElementById('cota').value='';
    document.getElementById('res').innerHTML='';
    const opTxt={'<=':'≤','<':'<','==':'=','>=':'≥','>':'>'}[e.op]||e.op;
    const atrTxt={valor:'valor',valor_abs:'|valor|',longitud:'longitud',longitud_sin_comillas:'longitud (sin comillas)'}[e.atr];
    document.getElementById('mod').innerHTML=`<p>ER: <code>${esc(e.mER)}</code></p><p>Acción léxica: aceptar si <b>${atrTxt} ${opTxt} ${e.cota}</b>; si no, error léxico (fuera de cota).</p>
      <pre>{ if( ${atrTxt} ${opTxt} ${e.cota} ) return TOKEN;\n  else error("fuera de cota"); }</pre>`;
  }
  sel.onchange=load; load();
  document.getElementById('val').onclick=validateAL;
}
function validateAL(){
  const e=AL_EJ[+document.getElementById('ex').value];
  const defs=parseConjuntos(document.getElementById('cj').value);
  const expr=document.getElementById('er').value.trim();
  const atr=document.getElementById('atr').value;
  const op=document.getElementById('op').value.replace('&lt;','<').replace('&gt;','>');
  const cotaRaw=document.getElementById('cota').value;
  const res=document.getElementById('res');
  if(!expr){ res.innerHTML=`<div class="err">Escribí la expresión regular.</div>`; return; }
  if(cotaRaw===''){ res.innerHTML=`<div class="err">Indicá la cota.</div>`; return; }
  const cota=parseFloat(cotaRaw);
  let rx; try{ rx=buildRegex(expr, defs); }catch(err){ res.innerHTML=`<div class="err">Error al compilar la ER: ${esc(err.message)}</div>`; return; }
  let html='', allOk=true;
  e.tests.forEach(tc=>{
    const formaOk=rx.test(tc.v);
    const cotaOk=formaOk ? cmp(attrValue(atr,tc.v),op,cota) : false;
    const acepta=formaOk && cotaOk;
    const pass=acepta===tc.ok;
    if(!pass)allOk=false;
    const motivo = tc.ok ? 'debe aceptar' : ('debe rechazar'+(tc.por?' (por '+tc.por+')':''));
    const got = acepta?'aceptado':(!formaOk?'rechazado por la ER':'rechazado por la cota');
    html+=`<div class="case ${pass?'pass':'fail'}"><span class="ico">${pass?'✓':'✗'}</span><span>${showStr(tc.v.length>30?tc.v.slice(0,27)+'…':tc.v)}</span><span class="exp">${motivo} · ${got}</span></div>`;
  });
  res.innerHTML=`<div class="verdict ${allOk?'ok':'bad'}">${allOk?'✓ ¡Correcta! La ER más la acción léxica se comportan como se espera.':'✗ Todavía no: mirá los casos en rojo (¿la cota está en la acción y no en la ER?).'}</div>`+html;
}

/* ---- GLC ---- */
function renderGLC(){
  let opts=GLC_EJ.map((e,i)=>`<option value="${i}">${esc(e.t)}</option>`).join('');
  panel.innerHTML=`<div class="card">
    <label class="fld">Ejercicio</label>
    <select id="ex">${opts}</select>
    <div class="consigna" id="cons"></div>
    <label class="fld">Gramática (una regla por línea: <code>NoTerminal -> símbolos | símbolos</code>. Usá ε para vacío. El primer no terminal es el símbolo distinguido.)</label>
    <textarea id="gr" rows="6" placeholder="S -> ( S ) S | ε"></textarea>
    <div id="sets"></div>
    <div class="row" style="margin-top:12px"><div style="flex:0"><button class="pri" id="val">Validar</button></div>
      <div style="flex:1"><input type="text" id="own" placeholder="probar una cadena propia (tokens separados por espacios)"></div>
      <div style="flex:0"><button id="valown">probar</button></div></div>
    <div class="res" id="res"></div>
    <details><summary>Ver respuesta modelo</summary><div class="modelo" id="mod"></div></details>
    <p class="hint">Los símbolos van separados por espacios. Todo símbolo que aparece a la izquierda de una regla es no terminal; el resto son terminales (id, cte, +, (, etc.). Se prueba con un reconocedor: acepta o no cada cadena.</p>
  </div>`;
  const sel=document.getElementById('ex');
  function load(){ const e=GLC_EJ[+sel.value];
    document.getElementById('cons').innerHTML=esc(e.c);
    document.getElementById('gr').value='';
    document.getElementById('own').value='';
    document.getElementById('res').innerHTML='';
    document.getElementById('sets').innerHTML=`<p class="hint" style="margin-top:10px">Debe <b>aceptar</b>: ${e.ac.map(s=>'<code>'+showStr(s)+'</code>').join(' ')}<br>Debe <b>rechazar</b>: ${e.rc.map(s=>'<code>'+showStr(s)+'</code>').join(' ')}</p>`;
    document.getElementById('mod').innerHTML=`<p>Una gramática válida:</p><pre>${esc(e.m)}</pre>`;
  }
  sel.onchange=load; load();
  document.getElementById('val').onclick=()=>validateGLC(false);
  document.getElementById('valown').onclick=()=>validateGLC(true);
}
function validateGLC(withOwn){
  const e=GLC_EJ[+document.getElementById('ex').value];
  const res=document.getElementById('res');
  let g; try{ g=parseGrammar(document.getElementById('gr').value); }catch(err){ res.innerHTML=`<div class="err">${esc(err.message)}</div>`; return; }
  if(!g.start){ res.innerHTML=`<div class="err">Escribí al menos una regla (NoTerminal -> ...).</div>`; return; }
  let html='', allOk=true;
  function run(s, should){ let acc; try{ acc=earleyAccepts(g, tokenize(s)); }catch(err){ acc=false; } const pass=acc===should; if(!pass)allOk=false;
    return `<div class="case ${pass?'pass':'fail'}"><span class="ico">${pass?'✓':'✗'}</span><span>${showStr(s)}</span><span class="exp">${should?'debe aceptar':'debe rechazar'}${pass?'':(acc?' — la acepta':' — la rechaza')}</span></div>`; }
  e.ac.forEach(s=>html+=run(s,true));
  e.rc.forEach(s=>html+=run(s,false));
  if(withOwn){ const o=document.getElementById('own').value; if(o.trim()!==''||o===''){ let acc; try{acc=earleyAccepts(g,tokenize(o));}catch(e2){acc=false;} html+=`<div class="case ${acc?'pass':'fail'}"><span class="ico">${acc?'✓':'✗'}</span><span>${showStr(o)}</span><span class="exp">${acc?'la acepta':'la rechaza'}</span></div>`; } }
  res.innerHTML=`<div class="verdict ${allOk?'ok':'bad'}">${allOk?'✓ ¡Correcta! Acepta y rechaza lo esperado.':'✗ Todavía no: revisá los casos en rojo.'}</div>`+html;
}

function insertAt(el,t){ el.focus(); const s=el.selectionStart,e=el.selectionEnd,v=el.value; el.value=v.slice(0,s)+t+v.slice(e); const p=s+t.length; el.selectionStart=el.selectionEnd=p; }

render();
</script>
</body>
</html>
