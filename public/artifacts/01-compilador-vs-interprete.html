<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compilador · intérprete · híbrido · JIT</title>
<style>
  :root{
    --surface-0:#faf9f5; --surface-1:#f1efe8; --surface-2:#ffffff;
    --text-primary:#1a1a18; --text-secondary:#5f5e5a; --text-muted:#8a8880;
    --border:#e2e0d8; --border-strong:#c8c6bd;
    --text-accent:#2c5aa0; --bg-accent:#e6f0fb; --radius:8px;
    --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --font-sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --surface-0:#1a1a18; --surface-1:#242422; --surface-2:#2e2e2b;
      --text-primary:#ecebe6; --text-secondary:#a8a7a0; --text-muted:#6f6e69;
      --border:#3a3a37; --border-strong:#4a4a46;
      --text-accent:#9db8e8; --bg-accent:#22304a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--surface-0);color:var(--text-primary);
       font-family:var(--font-sans);line-height:1.6;font-size:15px}
  button{font-family:inherit;background:transparent;border:.5px solid var(--border-strong);
         color:var(--text-secondary);border-radius:var(--radius);padding:8px 14px;cursor:pointer;transition:background .15s}
  button:hover{background:var(--surface-1)}
</style>
</head>
<body>
<div style="max-width:720px;margin:0 auto;">

  <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:1.25rem;">
    <button id="m0" style="font-size:13px;">Compilador</button>
    <button id="m1" style="font-size:13px;">Intérprete</button>
    <button id="m2" style="font-size:13px;">Híbrido (Java)</button>
    <button id="m3" style="font-size:13px;">JIT</button>
  </div>

  <div style="display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; margin-bottom:12px;">
    <div style="background:var(--surface-1); border-radius:12px; padding:1rem;">
      <div style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">tiempo de compilación</div>
      <div id="compi" style="font-family:var(--font-mono); font-size:12px; line-height:1.9; color:var(--text-primary); white-space:pre;"></div>
    </div>
    <div style="background:var(--surface-1); border-radius:12px; padding:1rem;">
      <div style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">tiempo de ejecución</div>
      <div id="ejec" style="font-family:var(--font-mono); font-size:12px; line-height:1.9; color:var(--text-primary); white-space:pre;"></div>
    </div>
  </div>

  <div style="display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; margin-bottom:12px;">
    <div style="background:var(--surface-1); border-radius:var(--radius); padding:.85rem;">
      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:8px;">velocidad de ejecución</div>
      <div id="bar-vel" style="display:flex; gap:4px;"></div>
    </div>
    <div style="background:var(--surface-1); border-radius:var(--radius); padding:.85rem;">
      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:8px;">diagnóstico de error</div>
      <div id="bar-diag" style="display:flex; gap:4px;"></div>
    </div>
    <div style="background:var(--surface-1); border-radius:var(--radius); padding:.85rem;">
      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:8px;">portabilidad</div>
      <div id="bar-port" style="display:flex; gap:4px;"></div>
    </div>
  </div>

  <div style="background:var(--bg-accent); border-radius:var(--radius); padding:.85rem 1rem; margin-bottom:12px;">
    <div style="font-size:12px; color:var(--text-accent); margin-bottom:4px;">si hay un error en la línea 42</div>
    <div id="err" style="font-size:13px; color:var(--text-accent); line-height:1.6;"></div>
  </div>

  <div style="border-left:2px solid var(--border-strong); border-radius:0; padding-left:12px;">
    <div id="nota" style="font-size:13px; color:var(--text-secondary); line-height:1.7;"></div>
  </div>

</div>
<script>
const M=[
  {compi:"programa fuente\n     │\n     ▼\n  Compilador\n     │\n     ▼\nprograma destino\n(lenguaje máquina)",
   ejec:"programa destino\n     │\n entrada ──▶ ejecuta\n     │\n     ▼\n   salida",
   vel:3,diag:1,port:1,
   err:"El binario ya no sabe que existió una línea 42. El fuente se destruyó en la traducción; sin información de depuración, el mensaje es pobre.",
   nota:"Todo el trabajo de traducción se paga una sola vez, antes de ejecutar. Por eso corre rápido. El precio: el destino está atado a una arquitectura, y perdió toda referencia al fuente."},
  {compi:"—\n\n(no se produce\nningún artefacto)",
   ejec:"programa fuente\n     │\n entrada ──▶ Intérprete\n     │\n     ▼\n   salida",
   vel:1,diag:3,port:3,
   err:"Sabe exactamente en qué instrucción del fuente está parado, porque las va ejecutando de a una. Puede decirte la línea, la variable y el valor.",
   nota:"No hay traducción previa: el fuente se lee y se actúa sobre él, instrucción por instrucción. Más lento, pero conserva toda la información del programa original mientras corre."},
  {compi:"programa fuente\n     │\n     ▼\n  Traductor\n     │\n     ▼\n  bytecodes\n(programa intermedio)",
   ejec:"  bytecodes\n     │\n entrada ──▶ Máquina virtual\n     │      (los interpreta)\n     ▼\n   salida",
   vel:2,diag:3,port:3,
   err:"La VM conserva la referencia al fuente dentro de los bytecodes: por eso Java te da un stack trace con archivo y línea.",
   nota:"Se compila una vez a un lenguaje intermedio neutro, y cada máquina lo interpreta con su propia VM. Los bytecodes compilados en una máquina pueden interpretarse en otra, incluso a través de una red."},
  {compi:"programa fuente\n     │\n     ▼\n  Traductor\n     │\n     ▼\n  bytecodes",
   ejec:"  bytecodes\n     │\n     ▼\n   Compilador JIT\n     │  (traduce justo\n     │   antes de correr)\n     ▼\nlenguaje máquina ──▶ salida",
   vel:3,diag:2,port:3,
   err:"Depende: el código ya compilado corre a máquina, pero la VM sigue guardando el mapeo hacia el fuente.",
   nota:"Un compilador que corre en tiempo de ejecución. Traduce los bytecodes a lenguaje máquina justo antes de ejecutar el programa intermedio. Recupera la velocidad del compilador sin perder la portabilidad del híbrido."}
];
let sel=0; const $=id=>document.getElementById(id);
function bars(el,n){el.innerHTML="";for(let k=0;k<3;k++){const d=document.createElement("div");
  d.style.cssText="height:6px; flex:1; border-radius:3px; background:"+(k<n?"var(--text-primary)":"var(--border)");el.appendChild(d);}}
function render(){const m=M[sel];
  $("compi").textContent=m.compi; $("ejec").textContent=m.ejec; $("err").textContent=m.err; $("nota").textContent=m.nota;
  bars($("bar-vel"),m.vel); bars($("bar-diag"),m.diag); bars($("bar-port"),m.port);
  for(let k=0;k<4;k++){const b=$("m"+k);
    b.style.borderColor=(k===sel)?"var(--text-primary)":"var(--border-strong)";
    b.style.color=(k===sel)?"var(--text-primary)":"var(--text-secondary)";}}
for(let k=0;k<4;k++)$("m"+k).onclick=()=>{sel=k;render();};
render();
</script>
</body>
</html>
