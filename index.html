<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Lenguajes y Compiladores · UNLaM</title>
  <meta name="description" content="Teoría, plan de estudio y ejercicios que se corrigen ejecutándose, para Lenguajes y Compiladores (UNLaM 1124/3663)." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/ibm-plex-sans-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <script>
    /* Estampa el tema antes del primer pintado. Sin esto hay un flash de claro mientras
       React monta, que de noche —el escenario de uso principal— es un fogonazo en la cara.
       Envuelto en try porque en modo privado localStorage puede tirar. */
    try {
      var t = JSON.parse(localStorage.getItem('lyc-tema') || '""');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
