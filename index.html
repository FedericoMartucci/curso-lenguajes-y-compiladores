<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lenguajes y Compiladores · Curso</title>
<style>
  :root{
    --surface-0:#faf9f5; --surface-1:#f1efe8; --surface-2:#ffffff;
    --text-primary:#1a1a18; --text-secondary:#5f5e5a; --text-muted:#8a8880;
    --border:#e2e0d8; --border-strong:#c8c6bd;
    --text-accent:#2c5aa0; --bg-accent:#e6f0fb;
    --ok:#3b6d11; --warn:#854f0b; --purple:#534ab7;
    --radius:8px;
    --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
    --font-sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --sidebar:300px;
  }
  html[data-theme="dark"]{
    --surface-0:#1a1a18; --surface-1:#242422; --surface-2:#2e2e2b;
    --text-primary:#ecebe6; --text-secondary:#a8a7a0; --text-muted:#6f6e69;
    --border:#3a3a37; --border-strong:#4a4a46;
    --text-accent:#9db8e8; --bg-accent:#22304a;
    --ok:#97c459; --warn:#ef9f27; --purple:#afa9ec;
  }
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]){
      --surface-0:#1a1a18; --surface-1:#242422; --surface-2:#2e2e2b;
      --text-primary:#ecebe6; --text-secondary:#a8a7a0; --text-muted:#6f6e69;
      --border:#3a3a37; --border-strong:#4a4a46;
      --text-accent:#9db8e8; --bg-accent:#22304a;
      --ok:#97c459; --warn:#ef9f27; --purple:#afa9ec;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface-0);color:var(--text-primary);
       font-family:var(--font-sans);line-height:1.7;font-size:16px}
  a{color:var(--text-accent);text-decoration:none}
  code{font-family:var(--font-mono);font-size:.9em;background:var(--surface-1);
       padding:1px 5px;border-radius:4px}
  pre{background:var(--surface-1);border:.5px solid var(--border);border-radius:var(--radius);
      padding:12px 14px;overflow-x:auto;font-family:var(--font-mono);font-size:13px;line-height:1.55}
  pre code{background:none;padding:0}

  /* layout */
  #wrap{display:flex;min-height:100vh}
  #side{width:var(--sidebar);flex:0 0 var(--sidebar);border-right:.5px solid var(--border);
        background:var(--surface-1);height:100vh;position:sticky;top:0;overflow-y:auto;padding:16px 0}
  #main{flex:1;min-width:0;max-width:860px;margin:0 auto;padding:32px 40px 80px}
  @media(max-width:820px){
    :root{--sidebar:0px}
    #side{position:fixed;z-index:40;left:0;top:0;width:290px;flex-basis:290px;
          transform:translateX(-100%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25)}
    #side.open{transform:translateX(0)}
    #main{padding:20px 18px 80px}
  }

  /* sidebar */
  .brand{padding:4px 20px 14px;border-bottom:.5px solid var(--border);margin-bottom:8px}
  .brand h1{font-size:15px;font-weight:500;margin:0}
  .brand p{font-size:12px;color:var(--text-muted);margin:2px 0 0}
  .prog{padding:10px 20px 2px}
  .progbar{height:7px;background:var(--surface-2);border:.5px solid var(--border);border-radius:4px;overflow:hidden}
  .progfill{height:100%;background:var(--text-accent);width:0;transition:width .4s}
  .progtext{font-size:11px;color:var(--text-muted);margin-top:5px;display:flex;justify-content:space-between}
  .hprog{margin:1.2rem 0 .4rem}
  .hprog .progbar{height:12px;border-radius:6px}
  .hprog .lab{font-size:13px;color:var(--text-secondary);margin-bottom:6px;display:flex;justify-content:space-between}
  .search{margin:10px 16px 6px}
  .search input{width:100%;height:34px;padding:0 10px;border:.5px solid var(--border-strong);
     border-radius:var(--radius);background:var(--surface-2);color:var(--text-primary);font-family:inherit;font-size:13px}
  .navlink{display:flex;align-items:center;gap:8px;padding:7px 20px;font-size:13px;color:var(--text-secondary);cursor:pointer}
  .navlink:hover{background:var(--surface-2)}
  .navlink.active{color:var(--text-primary);background:var(--surface-2);box-shadow:inset 2px 0 0 var(--text-accent)}
  .modtitle{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-muted);
     padding:14px 20px 4px;font-weight:500;display:flex;justify-content:space-between}
  .les{display:flex;gap:8px;align-items:baseline;padding:5px 20px 5px 24px;font-size:13px;
     color:var(--text-secondary);cursor:pointer;border:none;background:none;width:100%;text-align:left;font-family:inherit;line-height:1.4}
  .les:hover{background:var(--surface-2)}
  .les.active{color:var(--text-primary);background:var(--surface-2);box-shadow:inset 2px 0 0 var(--text-accent)}
  .les .n{color:var(--text-muted);font-family:var(--font-mono);font-size:11px;flex:0 0 auto;min-width:26px}
  .les .dot{margin-left:auto;font-size:10px;flex:0 0 auto}

  /* badges */
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;line-height:1.5;
     border:.5px solid var(--border-strong);color:var(--text-secondary);white-space:nowrap}
  .badge.tgt{color:var(--text-accent);border-color:var(--text-accent);background:var(--bg-accent)}
  .badge.aho{color:var(--purple);border-color:var(--purple)}
  .badge.work{color:var(--warn);border-color:var(--warn)}
  .pill{font-size:11px;padding:2px 9px;border-radius:20px}
  .pill.dictada{background:var(--bg-accent);color:var(--text-accent)}
  .pill.resumen{background:var(--surface-1);color:var(--text-secondary);border:.5px solid var(--border)}

  /* lesson content */
  .crumbs{font-size:12px;color:var(--text-muted);margin-bottom:6px}
  h2.title{font-size:24px;font-weight:500;margin:.2rem 0 .5rem;line-height:1.25}
  .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  .content h3{font-size:18px;font-weight:500;margin:1.8rem 0 .6rem}
  .content h4{font-size:15px;font-weight:500;margin:1.4rem 0 .4rem;color:var(--text-secondary)}
  .content p{margin:.7rem 0}
  .content ul{margin:.6rem 0;padding-left:1.3rem}
  .content li{margin:.35rem 0}
  .content table{border-collapse:collapse;width:100%;font-size:14px;margin:1rem 0;display:block;overflow-x:auto}
  .content th,.content td{border:.5px solid var(--border);padding:7px 10px;text-align:left;vertical-align:top}
  .content th{background:var(--surface-1);font-weight:500}
  .callout{border-radius:var(--radius);padding:12px 16px;margin:1rem 0;font-size:14px;line-height:1.65}
  .callout.tgt{background:var(--bg-accent)}
  .callout.tgt .lab{color:var(--text-accent);font-size:12px;font-weight:500;display:block;margin-bottom:3px}
  .callout.aho{background:var(--surface-1);border-left:2px solid var(--purple)}
  .callout.aho .lab{color:var(--purple);font-size:12px;font-weight:500;display:block;margin-bottom:3px}

  .artifact-card{margin:1.4rem 0;border:.5px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface-2)}
  .artifact-card .hd{display:flex;justify-content:space-between;align-items:center;
     padding:8px 14px;border-bottom:.5px solid var(--border);font-size:12px;color:var(--text-muted)}
  .artifact-card iframe{width:100%;border:0;display:block;background:var(--surface-0)}

  /* Q&A */
  .qa{margin:.7rem 0;border:.5px solid var(--border);border-radius:var(--radius);overflow:hidden}
  .qa summary{cursor:pointer;padding:12px 16px;font-size:14.5px;background:var(--surface-1);
     list-style:none;display:flex;gap:10px;align-items:baseline}
  .qa summary::-webkit-details-marker{display:none}
  .qa summary .qn{color:var(--text-muted);font-family:var(--font-mono);font-size:12px;flex:0 0 auto}
  .qa summary:hover{background:var(--surface-2)}
  .qa[open] summary{border-bottom:.5px solid var(--border)}
  .qa .ans{padding:12px 16px 14px 42px;font-size:14px}
  .qa .ans p{margin:.5rem 0}
  .qa .ans .modlab{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ok);font-weight:500}

  /* pager */
  .pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:20px;border-top:.5px solid var(--border)}
  .pager button{flex:1;text-align:left;background:var(--surface-1);border:.5px solid var(--border);
     border-radius:12px;padding:12px 16px;cursor:pointer;color:var(--text-primary);font-family:inherit;min-width:0}
  .pager button:hover{border-color:var(--border-strong)}
  .pager button.nx{text-align:right}
  .pager .dir{font-size:11px;color:var(--text-muted)}
  .pager .lt{font-size:13.5px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pager button[disabled]{opacity:.35;cursor:default}

  /* topbar (mobile) */
  #topbar{display:none}
  @media(max-width:820px){
    #topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:.5px solid var(--border);
       position:sticky;top:0;background:var(--surface-0);z-index:30}
  }
  .iconbtn{background:transparent;border:.5px solid var(--border-strong);border-radius:var(--radius);
     color:var(--text-secondary);cursor:pointer;padding:6px 11px;font-size:14px;font-family:inherit}
  .iconbtn:hover{background:var(--surface-1)}

  .home-hero h2{font-size:26px;font-weight:500;margin:.4rem 0}
  .home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:1.2rem 0}
  .stat{background:var(--surface-1);border-radius:12px;padding:14px 16px}
  .stat .v{font-size:24px;font-weight:500}
  .stat .l{font-size:12px;color:var(--text-secondary)}
  .modcard{border:.5px solid var(--border);border-radius:12px;padding:14px 16px;margin:10px 0;cursor:pointer;background:var(--surface-2)}
  .modcard:hover{border-color:var(--border-strong)}
  .modcard h4{margin:0 0 3px;font-size:15px;font-weight:500}
  .modcard p{margin:0;font-size:12.5px;color:var(--text-muted)}
  .searchresult{padding:10px 14px;border:.5px solid var(--border);border-radius:var(--radius);margin:8px 0;cursor:pointer;background:var(--surface-2)}
  .searchresult:hover{border-color:var(--border-strong)}
  .searchresult .t{font-size:14px}
  .searchresult .c{font-size:12px;color:var(--text-muted)}
  mark{background:var(--bg-accent);color:var(--text-accent);border-radius:3px;padding:0 2px}

  /* ejercitación */
  .filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:1rem 0}
  .chip{font-size:12px;padding:5px 12px;border-radius:20px;border:.5px solid var(--border-strong);background:transparent;color:var(--text-secondary);cursor:pointer}
  .chip.on{background:var(--text-accent);color:#fff;border-color:var(--text-accent)}
  .filters select{height:32px;border:.5px solid var(--border-strong);border-radius:6px;background:var(--surface-2);color:var(--text-primary);font-family:inherit;font-size:13px;padding:0 8px}
  .ejcard{background:var(--surface-2);border:.5px solid var(--border);border-radius:12px;padding:20px 22px;margin-top:12px}
  .ejmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:12px;color:var(--text-muted)}
  .ejtype{font-size:11px;padding:2px 9px;border-radius:20px}
  .ejtype.vf{background:var(--bg-accent);color:var(--text-accent)}
  .ejtype.practico{background:var(--surface-1);color:var(--warn);border:.5px solid var(--warn)}
  .ejtype.desarrollar{background:var(--surface-1);color:var(--text-secondary)}
  .ejq{font-size:17px;line-height:1.6;margin:6px 0 16px}
  .ejans{border-top:.5px solid var(--border);padding-top:14px;margin-top:8px;font-size:14.5px}
  .ejans .modlab{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ok);font-weight:500;display:block;margin-bottom:6px}
  .ejbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
  .ejbtns button{padding:9px 16px;border-radius:8px;font-size:14px;cursor:pointer;font-family:inherit;border:.5px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary)}
  .ejbtns button.pri{background:var(--text-accent);color:#fff;border-color:var(--text-accent)}
  .ejbtns button.ok{border-color:var(--ok);color:var(--ok)}
  .ejbtns button.rev{border-color:var(--warn);color:var(--warn)}
  .ejprog{height:8px;background:var(--surface-1);border:.5px solid var(--border);border-radius:4px;overflow:hidden;margin-top:6px}
  .ejprog>div{height:100%;background:var(--ok);width:0}
  .ejtools{background:var(--bg-accent);border-radius:8px;padding:10px 14px;margin-top:14px;font-size:13px}
  .ejtools a{font-weight:500}
  .toolframe{width:100%;border:0;border-radius:12px;background:var(--surface-0);min-height:900px}
</style>
</head>
<body>
<div id="wrap">
  <aside id="side">
    <div class="brand">
      <h1>Lenguajes y Compiladores</h1>
      <p>UNLaM · 1124/3663 · Aho 2ª ed.</p>
    </div>
    <div class="prog">
      <div class="progbar"><div class="progfill" id="progfill"></div></div>
      <div class="progtext"><span>en profundidad</span><span id="progtext">0%</span></div>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Buscar en el curso…" autocomplete="off"></div>
    <div class="navlink" data-go="#/inicio">Inicio</div>
    <div class="navlink" data-go="#/ejercitar">Ejercitación</div>
    <div class="navlink" data-go="#/sandbox">Sandbox validable</div>
    <div class="navlink" data-go="#/mesa">Mesa de trabajo</div>
    <div class="navlink" data-go="#/transcripciones">Transcripciones</div>
    <div class="navlink" data-go="#/practicas">Enunciados de práctica</div>
    <div class="navlink" data-go="#/practica">Banco de preguntas</div>
    <nav id="toc"></nav>
    <div style="padding:16px 20px 4px">
      <button class="iconbtn" id="theme" style="width:100%">Cambiar tema</button>
    </div>
  </aside>

  <div style="flex:1;min-width:0">
    <div id="topbar">
      <button class="iconbtn" id="menu">☰</button>
      <strong style="font-size:14px;font-weight:500">Lenguajes y Compiladores</strong>
    </div>
    <main id="main">cargando…</main>
  </div>
</div>

<script src="data.js"></script>
<script src="transcripciones.js"></script>
<script src="enunciados.js"></script>
<script>
(function(){
  const CURSO = window.CURSO || {modulos:[]};
  const main = document.getElementById('main');
  const toc = document.getElementById('toc');
  const side = document.getElementById('side');

  // flatten lessons in order
  const flat = [];
  CURSO.modulos.forEach(m=>m.lecciones.forEach(l=>flat.push(Object.assign({mod:m},l))));
  const byId = {}; flat.forEach((l,ix)=>{l._ix=ix; byId[l.id]=l;});

  // theme
  try{const t=localStorage.getItem('lyc-theme'); if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}
  document.getElementById('theme').onclick=()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const dark=cur? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const nt=dark?'light':'dark';
    document.documentElement.setAttribute('data-theme',nt);
    try{localStorage.setItem('lyc-theme',nt);}catch(e){}
  };
  document.getElementById('menu').onclick=()=>side.classList.toggle('open');

  // build TOC
  function buildTOC(){
    let h='';
    CURSO.modulos.forEach(m=>{
      h+=`<div class="modtitle"><span>${m.id}. ${esc(m.titulo)}</span><span>${m.parcial||''}</span></div>`;
      m.lecciones.forEach(l=>{
        const dot = l.estado==='dictada' ? `<span class="dot" style="color:var(--text-accent)" title="clase completa">●</span>`
                  : l.artifact ? `<span class="dot" style="color:var(--warn)" title="con artifact">◐</span>` : '';
        h+=`<button class="les" data-id="${l.id}"><span class="n">${l.id}</span><span>${esc(l.titulo)}</span>${dot}</button>`;
      });
    });
    toc.innerHTML=h;
    toc.querySelectorAll('.les').forEach(b=>b.onclick=()=>{location.hash='#/l/'+b.dataset.id;side.classList.remove('open');});
  }
  document.querySelectorAll('.navlink').forEach(n=>n.onclick=()=>{location.hash=n.dataset.go;side.classList.remove('open');});

  function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  function setActive(id){
    toc.querySelectorAll('.les').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
    document.querySelectorAll('.navlink').forEach(n=>n.classList.toggle('active',false));
  }

  function renderHome(){
    setActive(null);
    const total=flat.length;
    const dic=flat.filter(l=>l.estado==='dictada').length;
    const arts=flat.filter(l=>l.artifact).length;
    const qa=flat.reduce((a,l)=>a+((l.qa||[]).length),0);
    let h=`<div class="home-hero">
      <div class="crumbs">Curso completo · offline</div>
      <h2>Lenguajes y Compiladores</h2>
      <p style="color:var(--text-secondary);max-width:60ch">Todo el material del curso, paginado e indexado sobre el libro de Aho y los apuntes de la cátedra. Andá por los módulos en orden, o buscá un tema puntual. Cada lección trae su explicación, los visualizadores para practicar y preguntas con respuesta.</p>
      <div class="hprog">
        <div class="lab"><span>Avance del curso — lecciones en profundidad</span><span>${dic}/${total} · ${Math.round(dic/total*100)}%</span></div>
        <div class="progbar"><div class="progfill" style="width:${Math.round(dic/total*100)}%"></div></div>
      </div>
      <div class="home-grid">
        <div class="stat"><div class="v">${total}</div><div class="l">lecciones</div></div>
        <div class="stat"><div class="v">${dic}</div><div class="l">clases completas</div></div>
        <div class="stat"><div class="v">${arts}</div><div class="l">visualizadores</div></div>
        <div class="stat"><div class="v">${qa}</div><div class="l">preguntas</div></div>
      </div>
      <p style="font-size:13px;color:var(--text-muted)">Referencias: <span class="badge tgt">🎯 entra al parcial</span> <span class="badge aho">📘 profundidad Aho</span> <span class="badge work">⚙️ taller</span> &nbsp;·&nbsp; ● clase completa &nbsp; ◐ con visualizador</p>
    </div>
    <h3 style="font-size:16px;font-weight:500;margin-top:1.5rem">Módulos</h3>`;
    CURSO.modulos.forEach(m=>{
      const n=m.lecciones.length;
      h+=`<div class="modcard" data-first="${m.lecciones[0].id}">
        <h4>${m.id}. ${esc(m.titulo)} <span style="color:var(--text-muted);font-weight:400;font-size:12px">· ${n} lecciones · Parcial ${m.parcial||'—'}</span></h4>
        <p>${esc(m.resumen||'')}</p></div>`;
    });
    main.innerHTML=h;
    main.querySelectorAll('.modcard').forEach(c=>c.onclick=()=>location.hash='#/l/'+c.dataset.first);
    scrollTop();
  }

  function renderLesson(id){
    const l=byId[id]; if(!l){renderHome();return;}
    setActive(id);
    const badges=(l.badges||[]).map(b=>{
      if(b==='🎯')return '<span class="badge tgt">🎯 parcial</span>';
      if(b==='📘')return '<span class="badge aho">📘 Aho</span>';
      if(b==='⚙️')return '<span class="badge work">⚙️ taller</span>';
      return '';
    }).join(' ');
    const pill = l.estado==='dictada' ? '<span class="pill dictada">clase completa</span>' : '<span class="pill resumen">resumen + referencia</span>';
    let h=`<div class="crumbs">Módulo ${l.mod.id} · ${esc(l.mod.titulo)}</div>
      <h2 class="title">${l.id} — ${esc(l.titulo)}</h2>
      <div class="meta">${pill}${badges}${l.aho?`<span class="badge">${esc(l.aho)}</span>`:''}</div>
      <div class="content">${l.html||'<p style="color:var(--text-muted)">Contenido en preparación. Mientras tanto, mirá la referencia de Aho indicada arriba.</p>'}</div>`;

    if(l.artifact){
      h+=`<div class="artifact-card">
        <div class="hd"><span>visualizador · ${esc(l.artifactTitle||'interactivo')}</span>
          <a href="${l.artifact}" target="_blank" rel="noopener">abrir en pestaña ↗</a></div>
        <iframe src="${l.artifact}" style="height:${l.artifactH||620}px" loading="lazy" title="visualizador"></iframe></div>`;
    }

    if(l.qa&&l.qa.length){
      h+=`<h3 style="font-size:17px;font-weight:500;margin-top:1.8rem">Preguntas para practicar</h3>
        <p style="font-size:13px;color:var(--text-muted);margin-top:-2px">Resolvé de memoria antes de abrir la respuesta.</p>`;
      l.qa.forEach((p,i)=>{
        h+=`<details class="qa"><summary><span class="qn">${i+1}</span><span>${p.q}</span></summary>
          <div class="ans"><span class="modlab">respuesta</span>${p.a}</div></details>`;
      });
    }

    // pager
    const prev=flat[l._ix-1], next=flat[l._ix+1];
    h+=`<div class="pager">
      ${prev?`<button data-id="${prev.id}"><div class="dir">‹ anterior</div><div class="lt">${prev.id} ${esc(prev.titulo)}</div></button>`:'<button disabled></button>'}
      ${next?`<button class="nx" data-id="${next.id}"><div class="dir">siguiente ›</div><div class="lt">${next.id} ${esc(next.titulo)}</div></button>`:'<button class="nx" disabled></button>'}
    </div>`;
    main.innerHTML=h;
    main.querySelectorAll('.pager button[data-id]').forEach(b=>b.onclick=()=>location.hash='#/l/'+b.dataset.id);
    scrollTop();
  }

  function renderPractica(){
    setActive(null);
    let h=`<div class="crumbs">Todas las preguntas del curso</div>
      <h2 class="title">Banco de práctica</h2>
      <p style="color:var(--text-secondary)">Todas las preguntas, agrupadas por módulo. Filtrá con el buscador de arriba a la izquierda para ir a un tema puntual.</p>`;
    CURSO.modulos.forEach(m=>{
      const qs=[]; m.lecciones.forEach(l=>(l.qa||[]).forEach(p=>qs.push({l,p})));
      if(!qs.length)return;
      h+=`<h3 style="font-size:16px;font-weight:500;margin-top:1.6rem">${m.id}. ${esc(m.titulo)} <span style="font-size:12px;color:var(--text-muted);font-weight:400">· ${qs.length} preguntas</span></h3>`;
      qs.forEach((x,i)=>{
        h+=`<details class="qa"><summary><span class="qn">${x.l.id}</span><span>${x.p.q}</span></summary>
          <div class="ans"><span class="modlab">respuesta</span>${x.p.a}
          <p style="margin-top:8px"><a href="#/l/${x.l.id}">→ ir a la lección ${x.l.id}</a></p></div></details>`;
      });
    });
    main.innerHTML=h; scrollTop();
  }

  function renderSearch(term){
    setActive(null);
    const t=term.toLowerCase();
    const res=flat.filter(l=>{
      const hay=(l.id+' '+l.titulo+' '+(l.aho||'')+' '+strip(l.html||'')+' '+(l.qa||[]).map(q=>q.q+' '+strip(q.a)).join(' ')).toLowerCase();
      return hay.includes(t);
    });
    let h=`<div class="crumbs">Búsqueda</div><h2 class="title">“${esc(term)}”</h2>
      <p style="color:var(--text-secondary)">${res.length} resultado${res.length===1?'':'s'}.</p>`;
    res.forEach(l=>{
      h+=`<div class="searchresult" data-id="${l.id}">
        <div class="t">${l.id} · ${hl(l.titulo,t)}</div>
        <div class="c">Módulo ${l.mod.id} · ${esc(l.mod.titulo)}${l.aho?' · '+esc(l.aho):''}</div></div>`;
    });
    if(!res.length)h+=`<p style="color:var(--text-muted)">Sin coincidencias. Probá con otra palabra (ej. “SLR”, “polaca”, “coprocesador”).</p>`;
    main.innerHTML=h;
    main.querySelectorAll('.searchresult').forEach(r=>r.onclick=()=>location.hash='#/l/'+r.dataset.id);
    scrollTop();
  }
  function strip(html){return (html||'').replace(/<[^>]+>/g,' ');}
  function hl(s,t){const i=s.toLowerCase().indexOf(t);if(i<0)return esc(s);
    return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+t.length))+'</mark>'+esc(s.slice(i+t.length));}

  function scrollTop(){main.scrollTop=0;window.scrollTo(0,0);}

  // search box
  let timer=null;
  document.getElementById('q').addEventListener('input',e=>{
    const v=e.target.value.trim();
    clearTimeout(timer);
    timer=setTimeout(()=>{ if(v.length>=2) location.hash='#/buscar/'+encodeURIComponent(v);
      else if(location.hash.startsWith('#/buscar')) location.hash='#/inicio'; },180);
  });

  // ===== Ejercitación =====
  let BANK=null;
  function classify(q, badges){
    const t=(q||'').toLowerCase();
    if(t.indexOf('v/f')===0 || t.indexOf('verdadero o falso')>=0 || t.indexOf('v/f')>=0) return 'vf';
    if((badges||[]).indexOf('⚙️')>=0) return 'practico';
    if(/^(resolvé|escribí|definí|construí|calculá|dá los|dá la|traducí|aplic|factoriz|eliminá|reescrib|dibujá|derivá|hacé|pasá|armá)/i.test(q||'')) return 'practico';
    return 'desarrollar';
  }
  function buildBank(){
    if(BANK) return BANK; BANK=[];
    flat.forEach(l=>(l.qa||[]).forEach((p,idx)=>{
      BANK.push({qid:l.id+'#'+idx, modId:l.mod.id, modT:l.mod.titulo, lid:l.id, lt:l.titulo, q:p.q, a:p.a, tipo:classify(p.q,l.badges)});
    }));
    return BANK;
  }
  function ejGet(){ try{return JSON.parse(localStorage.getItem('lyc-ejerc')||'{}');}catch(e){return {};} }
  function ejSet(o){ try{localStorage.setItem('lyc-ejerc',JSON.stringify(o));}catch(e){} }
  const TIPO={vf:'Verdadero / Falso', practico:'Práctico', desarrollar:'Desarrollar'};
  let ejFilter={tipo:'todos',mod:'todos'}, ejDeck=[], ejPos=0, ejRev=false;
  function ejBuildDeck(){
    const b=buildBank().filter(x=>(ejFilter.tipo==='todos'||x.tipo===ejFilter.tipo)&&(ejFilter.mod==='todos'||String(x.modId)===String(ejFilter.mod)));
    for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=b[i];b[i]=b[j];b[j]=t;}
    ejDeck=b; ejPos=0; ejRev=false;
  }
  function renderEjercitar(rebuild){
    setActive(null);
    if(rebuild||!ejDeck.length) ejBuildDeck();
    const prog=ejGet();
    const mods=[...new Set(buildBank().map(x=>x.modId))];
    let h=`<div class="crumbs">Práctica activa</div><h2 class="title">Ejercitación</h2>
      <p style="color:var(--text-secondary)">Te tiro una pregunta al azar, la resolvés de memoria, y te autoevaluás. Lo que marques para repasar vuelve a aparecer. El progreso se guarda en este navegador.</p>
      <div class="filters">
        <span style="font-size:12px;color:var(--text-muted)">Tipo:</span>
        ${['todos','vf','desarrollar','practico'].map(t=>`<button class="chip${ejFilter.tipo===t?' on':''}" data-tipo="${t}">${t==='todos'?'Todos':TIPO[t]}</button>`).join('')}
        <span style="font-size:12px;color:var(--text-muted);margin-left:8px">Módulo:</span>
        <select id="ejmod"><option value="todos">Todos</option>${mods.map(m=>`<option value="${m}"${String(ejFilter.mod)===String(m)?' selected':''}>${m} · ${esc(CURSO.modulos.find(x=>x.id===m).titulo)}</option>`).join('')}</select>
      </div>`;
    if(!ejDeck.length){ h+=`<p style="color:var(--text-muted)">No hay preguntas con ese filtro.</p>`; main.innerHTML=h; wireEj(); return; }
    if(ejPos>=ejDeck.length){
      const known=ejDeck.filter(x=>prog[x.qid]==='known').length;
      h+=`<div class="ejcard"><h3 style="font-size:18px;font-weight:500;margin:0 0 8px">¡Terminaste la tanda!</h3>
        <p style="color:var(--text-secondary)">Recorriste ${ejDeck.length} preguntas. Marcaste ${known} como sabidas.</p>
        <div class="ejbtns"><button class="pri" id="ejrestart">Otra tanda ↻</button>
        <button id="ejrepasar">Solo las de repasar</button></div></div>`;
      main.innerHTML=h; wireEj(); return;
    }
    const c=ejDeck[ejPos];
    const st=prog[c.qid];
    const done=ejDeck.filter(x=>prog[x.qid]).length;
    h+=`<div class="ejprog"><div style="width:${Math.round(ejPos/ejDeck.length*100)}%"></div></div>
      <div style="font-size:12px;color:var(--text-muted);margin-top:4px;display:flex;justify-content:space-between">
        <span>Pregunta ${ejPos+1} de ${ejDeck.length}</span><span>${done} respondidas · ${st?(st==='known'?'sabida':'a repasar'):'nueva'}</span></div>
      <div class="ejcard">
        <div class="ejmeta"><span class="ejtype ${c.tipo}">${TIPO[c.tipo]}</span><span>Módulo ${c.modId} · ${esc(c.lt)}</span><a href="#/l/${c.lid}" style="font-size:12px">ver la lección →</a></div>
        <div class="ejq">${c.q}</div>`;
    if(c.tipo==='practico'||c.tipo==='vf'){
      h+=`<div class="ejtools"><i></i>Para resolverlo sin papel: <a href="#/mesa">abrí la Mesa de trabajo</a> (teclado de símbolos, bloc para tablas y constructor de árbol).</div>`;
    }
    if(!ejRev){
      h+=`<div class="ejbtns"><button class="pri" id="ejshow">Mostrar respuesta</button><button id="ejskip">Saltar →</button></div>`;
    }else{
      h+=`<div class="ejans"><span class="modlab">respuesta</span>${c.a}</div>
        <div class="ejbtns"><button class="ok" id="ejknown">La sabía ✓</button><button class="rev" id="ejrep">Repasar ↻</button></div>`;
    }
    h+=`</div>`;
    main.innerHTML=h; wireEj(); scrollTop();
  }
  function wireEj(){
    main.querySelectorAll('.chip[data-tipo]').forEach(b=>b.onclick=()=>{ejFilter.tipo=b.dataset.tipo;renderEjercitar(true);});
    const sel=document.getElementById('ejmod'); if(sel)sel.onchange=()=>{ejFilter.mod=sel.value;renderEjercitar(true);};
    const show=document.getElementById('ejshow'); if(show)show.onclick=()=>{ejRev=true;renderEjercitar(false);};
    const skip=document.getElementById('ejskip'); if(skip)skip.onclick=()=>{ejPos++;ejRev=false;renderEjercitar(false);};
    const kn=document.getElementById('ejknown'); if(kn)kn.onclick=()=>{const p=ejGet();p[ejDeck[ejPos].qid]='known';ejSet(p);ejPos++;ejRev=false;renderEjercitar(false);};
    const rp=document.getElementById('ejrep'); if(rp)rp.onclick=()=>{const p=ejGet();p[ejDeck[ejPos].qid]='repasar';ejSet(p);ejPos++;ejRev=false;renderEjercitar(false);};
    const rs=document.getElementById('ejrestart'); if(rs)rs.onclick=()=>renderEjercitar(true);
    const rr=document.getElementById('ejrepasar'); if(rr)rr.onclick=()=>{const p=ejGet();ejDeck=buildBank().filter(x=>p[x.qid]==='repasar');ejPos=0;ejRev=false;renderEjercitar(false);};
  }
  function renderMesa(){
    setActive(null);
    main.innerHTML=`<div class="crumbs">Herramienta</div><h2 class="title">Mesa de trabajo</h2>
      <p style="color:var(--text-secondary)">Teclado de símbolos, bloc monoespaciado para tablas SLR y trazas, y constructor de árbol de derivación — para practicar sin papel. <a href="tools/mesa-de-trabajo.html" target="_blank" rel="noopener">abrir en pestaña completa ↗</a></p>
      <iframe class="toolframe" src="tools/mesa-de-trabajo.html" title="Mesa de trabajo"></iframe>`;
    scrollTop();
  }
  function renderSandbox(){
    setActive(null);
    main.innerHTML=`<div class="crumbs">Herramienta · autoevaluación</div><h2 class="title">Sandbox validable</h2>
      <p style="color:var(--text-secondary)">Escribí tu respuesta en la notación del parcial (expresiones regulares, acciones léxicas, gramáticas) y la valido de verdad contra ejemplos que aceptan y rechazan. <a href="tools/sandbox.html" target="_blank" rel="noopener">abrir en pestaña completa ↗</a></p>
      <iframe class="toolframe" src="tools/sandbox.html" title="Sandbox validable" style="min-height:1100px"></iframe>`;
    scrollTop();
  }
  function hlt(s,f){ if(!f) return esc(s); const i=s.toLowerCase().indexOf(f.toLowerCase()); if(i<0) return esc(s); return esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+f.length))+'</mark>'+esc(s.slice(i+f.length)); }
  function renderTranscripciones(id){
    setActive(null);
    const T=window.TRANSCRIPCIONES||[];
    if(!id){
      let h=`<div class="crumbs">Material de clase</div><h2 class="title">Transcripciones de clases</h2>
        <p style="color:var(--text-secondary)">Las clases grabadas y transcriptas, divididas en párrafos y con buscador. Complemento en las palabras del profesor a la teoría de cada módulo.</p>`;
      T.forEach(t=>{ h+=`<div class="modcard" data-id="${t.id}"><h4>${esc(t.titulo)}</h4><p>${esc(t.tag)} · ${t.parrafos.length} párrafos</p></div>`; });
      if(!T.length) h+=`<p style="color:var(--text-muted)">No hay transcripciones cargadas.</p>`;
      main.innerHTML=h; main.querySelectorAll('.modcard').forEach(c=>c.onclick=()=>location.hash='#/transcripciones/'+c.dataset.id);
      scrollTop(); return;
    }
    const t=T.find(x=>x.id===id); if(!t){ renderTranscripciones(); return; }
    main.innerHTML=`<div class="crumbs"><a href="#/transcripciones">Transcripciones</a> · ${esc(t.tag)}</div>
      <h2 class="title">${esc(t.titulo)}</h2>
      <input id="tq" type="search" placeholder="buscar en esta clase…" style="width:100%;height:36px;padding:0 12px;border:.5px solid var(--border-strong);border-radius:8px;background:var(--surface-2);color:var(--text-primary);font-family:inherit;font-size:14px;margin-bottom:16px">
      <div id="tbody" style="font-size:15.5px;line-height:1.75"></div>`;
    const body=document.getElementById('tbody');
    function paint(f){ const ff=(f||'').trim();
      const ps=t.parrafos.filter(p=>!ff||p.toLowerCase().indexOf(ff.toLowerCase())>=0);
      body.innerHTML = ps.length? ps.map(p=>`<p style="margin:.7rem 0">${hlt(p,ff)}</p>`).join('') : '<p style="color:var(--text-muted)">Sin coincidencias.</p>';
    }
    document.getElementById('tq').addEventListener('input',e=>paint(e.target.value));
    paint(''); scrollTop();
  }
  function renderPracticas(id){
    setActive(null);
    const E=window.ENUNCIADOS||[];
    if(!id){
      let h=`<div class="crumbs">Ejercitación · consignas oficiales</div><h2 class="title">Enunciados de práctica</h2>
        <p style="color:var(--text-secondary)">Las 6 prácticas de la cátedra. Las de expresiones regulares y gramáticas las podés resolver y autovalidar en el <a href="#/sandbox">Sandbox validable</a>.</p>`;
      E.forEach(e=>{ h+=`<div class="modcard" data-id="${e.id}"><h4>${esc(e.titulo)}</h4><p>${esc(e.tag)}</p></div>`; });
      if(!E.length) h+=`<p style="color:var(--text-muted)">No hay enunciados cargados.</p>`;
      main.innerHTML=h; main.querySelectorAll('.modcard').forEach(c=>c.onclick=()=>location.hash='#/practicas/'+c.dataset.id);
      scrollTop(); return;
    }
    const e=E.find(x=>x.id===id); if(!e){ renderPracticas(); return; }
    const linkSandbox=(e.id==='p1'||e.id==='p2')?`<div class="ejtools" style="margin-bottom:14px">Practicá estos ejercicios con validación automática en el <a href="#/sandbox">Sandbox</a>.</div>`:'';
    main.innerHTML=`<div class="crumbs"><a href="#/practicas">Enunciados</a> · ${esc(e.tag)}</div><h2 class="title">${esc(e.titulo)}</h2>${linkSandbox}
      <pre style="white-space:pre-wrap;font-family:var(--font-mono);font-size:13px;line-height:1.6;background:var(--surface-1);border:.5px solid var(--border);border-radius:8px;padding:14px 16px;overflow-x:auto">${esc(e.lineas.join('\n'))}</pre>`;
    scrollTop();
  }

  function route(){
    const hash=location.hash||'#/inicio';
    if(hash.startsWith('#/l/')) renderLesson(decodeURIComponent(hash.slice(4)));
    else if(hash.startsWith('#/buscar/')) renderSearch(decodeURIComponent(hash.slice(9)));
    else if(hash.startsWith('#/ejercitar')) renderEjercitar(true);
    else if(hash.startsWith('#/sandbox')) renderSandbox();
    else if(hash.startsWith('#/mesa')) renderMesa();
    else if(hash.startsWith('#/transcripciones/')) renderTranscripciones(decodeURIComponent(hash.slice(18)));
    else if(hash.startsWith('#/transcripciones')) renderTranscripciones();
    else if(hash.startsWith('#/practicas/')) renderPracticas(decodeURIComponent(hash.slice(12)));
    else if(hash.startsWith('#/practicas')) renderPracticas();
    else if(hash.startsWith('#/practica')) renderPractica();
    else renderHome();
  }
  window.addEventListener('hashchange',route);
  function updateProgress(){
    const dic=flat.filter(l=>l.estado==='dictada').length;
    const pct=Math.round(dic/flat.length*100);
    const f=document.getElementById('progfill'); if(f)f.style.width=pct+'%';
    const t=document.getElementById('progtext'); if(t)t.textContent=dic+'/'+flat.length+' · '+pct+'%';
  }
  buildTOC(); updateProgress(); route();
})();
</script>
</body>
</html>
